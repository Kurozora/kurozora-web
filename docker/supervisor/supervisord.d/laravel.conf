[program:Laravel-scheduler]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan schedule:work
autostart=true
autorestart=true
numprocs=1
user=www-data
stdout_logfile=/var/log/laravel_scheduler.out.log
stdout_logfile_maxbytes=0
redirect_stderr=true

[program:Laravel-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --sleep=3 --tries=3 --max-time=3600 --max-jobs=1000 --memory=128
autostart=true
autorestart=true
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/laravel_worker.out.log
stdout_logfile_maxbytes=0

[program:Laravel-scrape-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan queue:work redis --queue=scrape --sleep=3 --tries=3 --backoff=60 --max-time=3600 --max-jobs=500 --memory=192
autostart=true
autorestart=true
numprocs=1
user=www-data
redirect_stderr=true
stdout_logfile=/var/log/laravel_scrape_worker.out.log
stdout_logfile_maxbytes=0

[program:Laravel-reverb]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/html/artisan reverb:start --host=0.0.0.0 --port=8080
autostart=true
autorestart=true
numprocs=1
user=www-data
stdout_logfile=/var/log/laravel_reverb.out.log
stdout_logfile_maxbytes=0
redirect_stderr=true
