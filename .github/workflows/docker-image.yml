name: Build and push image to ECR

on:
  workflow_dispatch:
    inputs:
      runtime:
        description: Runtime image to build
        type: choice
        required: true
        default: both
        options:
          - both
          - fpm
          - frankenphp

permissions:
  id-token: write
  contents: read

jobs:
  build-and-push:
    name: Build and push (${{ matrix.runtime }}, linux/arm64)
    runs-on: ubuntu-24.04-arm
    if: github.repository_owner == 'Kurozora'

    strategy:
      fail-fast: false
      matrix:
        include:
          - runtime: fpm
            dockerfile: Dockerfile
            tag_prefix: arm64
          - runtime: frankenphp
            dockerfile: Dockerfile.frankenphp
            tag_prefix: frankenphp-arm64

    steps:
      - name: Skip non-selected runtime
        if: ${{ inputs.runtime != 'both' && inputs.runtime != matrix.runtime }}
        run: echo "skip=true" >> "$GITHUB_OUTPUT"
        id: skip

      - name: Checkout
        if: ${{ steps.skip.outputs.skip != 'true' }}
        uses: actions/checkout@v4

      - name: Fetch Nova source (private)
        if: ${{ steps.skip.outputs.skip != 'true' }}
        uses: actions/checkout@v4
        with:
          repository: Kurozora/nova-vendor
          ssh-key: ${{ secrets.NOVA_DEPLOY_KEY }}
          path: nova

      - name: Configure AWS credentials (OIDC)
        if: ${{ steps.skip.outputs.skip != 'true' }}
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.IAM_ROLE }}
          role-session-name: gha-ecr-push
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Login to Amazon ECR
        if: ${{ steps.skip.outputs.skip != 'true' }}
        id: login-ecr
        uses: aws-actions/amazon-ecr-login@v2

      - name: Set up Docker Buildx
        if: ${{ steps.skip.outputs.skip != 'true' }}
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        if: ${{ steps.skip.outputs.skip != 'true' }}
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ${{ matrix.dockerfile }}
          platforms: linux/arm64
          push: true
          provenance: false
          sbom: false
          build-args: |
            VITE_REVERB_HOST=${{ vars.VITE_REVERB_HOST }}
            VITE_REVERB_PORT=${{ vars.VITE_REVERB_PORT }}
            VITE_REVERB_SCHEME=${{ vars.VITE_REVERB_SCHEME }}
          secrets: |
            vite_reverb_app_key=${{ secrets.VITE_REVERB_APP_KEY }}
          tags: |
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ matrix.tag_prefix }}-${{ github.sha }}
            ${{ steps.login-ecr.outputs.registry }}/${{ secrets.ECR_REPOSITORY }}:${{ matrix.tag_prefix }}-latest
          cache-from: type=gha,scope=${{ matrix.runtime }}
          cache-to: type=gha,mode=max,scope=${{ matrix.runtime }}
